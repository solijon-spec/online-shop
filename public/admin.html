<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin panel — MobilePlus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23e3262f'/><text x='16' y='23' font-size='18' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'>M+</text></svg>">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-box" id="loginForm">
      <div class="brand"><span class="logo-mark app-ico">M<sup>+</sup></span><div><b>MobilePlus</b><small>Admin panel</small></div></div>
      <label class="field"><span>Parol</span><input class="input" type="password" name="password" autocomplete="current-password" required autofocus></label>
      <div class="err" id="loginErr"></div>
      <button class="btn btn-primary btn-block">Kirish</button>
      <a href="/" class="back">← Do'konga qaytish</a>
    </form>
  </div>

  <div id="shell" class="shell" hidden>
    <aside class="side">
      <div class="brand"><span class="logo-mark app-ico">M<sup>+</sup></span><div><b id="shopName">MobilePlus</b><small>Admin panel</small></div></div>
      <nav id="sideNav">
        <a href="#dashboard" data-v="dashboard"><i data-ico="chart" data-c="blue" data-s="xs"></i> <span>Bosh sahifa</span></a>
        <a href="#orders" data-v="orders"><i data-ico="receipt" data-c="red" data-s="xs"></i> <span>Buyurtmalar</span> <em id="newBadge" class="nbadge" hidden>0</em></a>
        <a href="#products" data-v="products"><i data-ico="box" data-c="orange" data-s="xs"></i> <span>Mahsulotlar</span></a>
        <a href="#categories" data-v="categories"><i data-ico="folder" data-c="teal" data-s="xs"></i> <span>Kategoriyalar</span></a>
        <a href="#settings" data-v="settings"><i data-ico="settings" data-c="gray" data-s="xs"></i> <span>Sozlamalar</span></a>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank"><i data-ico="globe"></i> Saytni ko'rish</a>
        <button id="logoutBtn" class="link"><i data-ico="logout"></i> Chiqish</button>
      </div>
    </aside>
    <main class="content">
      <div id="pwWarn" class="warn" hidden><i data-ico="alert"></i> Siz standart paroldan foydalanyapsiz. <a href="#settings">Sozlamalar</a> bo'limida parolni o'zgartiring.</div>
      <div id="view"></div>
    </main>
  </div>

  <div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
  <div id="toast" class="toast"></div>
  <script src="/icons.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
